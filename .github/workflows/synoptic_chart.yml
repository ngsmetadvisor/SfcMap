name: Synoptic Chart

on:
  # ── Manual trigger (the "Run workflow" button in the Actions tab) ──────────
  workflow_dispatch:

  # ── Scheduled runs ────────────────────────────────────────────────────────
  schedule:
    - cron: "37  0 * * *"   # 00:37 UTC daily  → 00Z data
    - cron: "37  6 * * *"   # 06:37 UTC daily  → 06Z data
    - cron: "37 13 * * *"   # 13:37 UTC daily  → 12Z data
    - cron: "37 18 * * *"   # 18:37 UTC daily  → 18Z data

jobs:
  build:
    name: Generate synoptic chart
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push docs/ back to the repo

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ── 3. Install dependencies ─────────────────────────────────────────
      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Auto-detect EXPORT_TIME from UTC hour ─────────────────────────
      - name: Determine export time
        run: |
          _h=$(date -u +"%H")
          if   [ "$_h" -lt  6 ]; then echo "EXPORT_TIME=0000Z" >> "$GITHUB_ENV"
          elif [ "$_h" -lt 12 ]; then echo "EXPORT_TIME=0600Z" >> "$GITHUB_ENV"
          elif [ "$_h" -lt 18 ]; then echo "EXPORT_TIME=1200Z" >> "$GITHUB_ENV"
          else                        echo "EXPORT_TIME=1800Z" >> "$GITHUB_ENV"
          fi

      # ── 5. Cache station list CSV ────────────────────────────────────────
      #       Avoids depending on orangecore.net being reachable every run.
      #       The cache is keyed on the file content — update by deleting
      #       the cache entry in Actions → Caches if the CSV ever changes.
      - name: Cache station list
        uses: actions/cache@v4
        with:
          path: AP_location.csv
          key: ap-location-csv-v1

      # ── 6. Run the chart generator ───────────────────────────────────────
      - name: Generate synoptic_map.html
        run: |
          mkdir -p output
          sed -i "s/^EXPORT_TIME  = '.*'/EXPORT_TIME  = '$EXPORT_TIME'/" synoptic_chart_creator.py
          python synoptic_chart_creator.py

      # ── 6. Copy to docs/ for GitHub Pages ───────────────────────────────
      #       GitHub Pages serves from docs/ on the main branch.
      #       synoptic_map.html  = always the latest chart (stable URL)
      #       archive/           = timestamped copies kept for history
      - name: Publish to GitHub Pages
        run: |
          STAMP=$(date -u +"%Y%m%d_%H%MZ")
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

          mkdir -p docs/archive

          # Latest — stable public URL:
          # https://<user>.github.io/<repo>/synoptic_map.html
          cp output/synoptic_map.html docs/synoptic_map.html

          # Timestamped archive copy
          cp output/synoptic_map.html "docs/archive/synoptic_map_${STAMP}.html"

          # Minimal index so the root URL isn't a blank 404
          cat > docs/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=synoptic_map.html">
            <title>Western Canada Synoptic Chart</title>
          </head>
          <body>
            <p>Redirecting to <a href="synoptic_map.html">latest chart</a>…</p>
          </body>
          </html>
          HTML

      # ── 7. Upload artifact (optional backup) ────────────────────────────
      - name: Upload chart as artifact
        uses: actions/upload-artifact@v4
        with:
          name: synoptic-chart-${{ env.STAMP }}
          path: docs/synoptic_map.html
          retention-days: 30

      # ── 8. Commit & push docs/ ───────────────────────────────────────────
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add docs/
          git diff --cached --quiet ||             git commit -m "chore: synoptic chart ${STAMP} [skip ci]"
          git push
