name: Synoptic Chart

on:
  # ── Manual trigger (the "Run workflow" button in the Actions tab) ──────────
  workflow_dispatch:

  # ── Scheduled runs ────────────────────────────────────────────────────────
  schedule:
    - cron: "37  0 * * *"   # 00:37 UTC daily  → 00Z data
    - cron: "37  6 * * *"   # 06:37 UTC daily  → 06Z data
    - cron: "37 13 * * *"   # 13:37 UTC daily  → 12Z data
    - cron: "37 18 * * *"   # 18:37 UTC daily  → 18Z data

jobs:
  build:
    name: Generate synoptic chart
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push output/ back to the repo

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ── 3. Install dependencies ─────────────────────────────────────────
      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Set EXPORT_TIME env var ─────────────────────────────────────
      #       Always auto-detected from UTC hour — applies to both
      #       scheduled runs and manual workflow_dispatch triggers.
      - name: Determine export time
        id: export_time
        run: |
          _h=$(date -u +"%H")
          if   [ "$_h" -lt  6 ]; then echo "EXPORT_TIME=0000Z" >> "$GITHUB_ENV"
          elif [ "$_h" -lt 12 ]; then echo "EXPORT_TIME=0600Z" >> "$GITHUB_ENV"
          elif [ "$_h" -lt 18 ]; then echo "EXPORT_TIME=1200Z" >> "$GITHUB_ENV"
          else                        echo "EXPORT_TIME=1800Z" >> "$GITHUB_ENV"
          fi

      # ── 5. Create output directory ──────────────────────────────────────
      - name: Prepare output directory
        run: mkdir -p output

      # ── 6. Run the chart generator ──────────────────────────────────────
      - name: Generate synoptic_map.html
        run: |
          # Patch EXPORT_TIME in the script at runtime so it matches the run
          sed -i "s/^EXPORT_TIME  = '.*'/EXPORT_TIME  = '$EXPORT_TIME'/" synoptic_chart_creator.py
          python synoptic_chart_creator.py

      # ── 7. Rename output with timestamp ─────────────────────────────────
      - name: Stamp output file
        run: |
          STAMP=$(date -u +"%Y%m%d_%H%MZ")
          cp output/synoptic_map.html "output/synoptic_map_${STAMP}.html"
          # Keep synoptic_map.html as the "latest" alias too
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      # ── 8. Upload as workflow artifact (always available, no git push needed) ──
      - name: Upload chart as artifact
        uses: actions/upload-artifact@v4
        with:
          name: synoptic-chart-${{ env.STAMP }}
          path: output/synoptic_map*.html
          retention-days: 30

      # ── 9. Commit & push output/ back to repo (optional — remove if unwanted) ─
      - name: Commit output to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          # Only commit if there's actually something new
          git diff --cached --quiet || \
            git commit -m "chore: synoptic chart ${STAMP} [skip ci]"
          git push
